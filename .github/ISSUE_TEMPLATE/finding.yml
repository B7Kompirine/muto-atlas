name: Finding · Bulgu
description: A measured fact the docs lack, or one they get wrong · Belgelerde olmayan ya da yanlış yazılmış, ölçülmüş bir bilgi
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        English or Turkish is fine. · Türkçe ya da İngilizce yazabilirsin.

        A finding needs a way to reproduce it. If you only have a hunch, write it anyway and say so — someone may be able to measure it.
        Bulgunun tekrar üretilebilmesi gerekir. Yalnız bir tahminin varsa yine yaz ve tahmin olduğunu belirt — belki başka biri ölçer.
  - type: textarea
    id: claim
    attributes:
      label: "The claim · İddia"
      description: "One or two sentences. · Bir iki cümle."
      placeholder: "Lights with TimeFlags 0 stay off inside interiors at every hour."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence · Kanıt"
      description: "What produced it (command, file, source line), how many samples, and the output. · Neyle bulundu (komut, dosya, kaynak satırı), kaç örnekte, çıktısı."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "How to reproduce · Nasıl tekrar üretilir"
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: "How sure are you? · Ne kadar eminsin?"
      description: "Confidence bands used across the docs · Belgelerde kullanılan güven bantları"
      options:
        - "95%+ — two independent sources agree, cross-checked on large data · iki bağımsız kaynak kesişti, büyük veride doğrulandı"
        - "85–94% — one strong source, partly cross-checked · tek güçlü kaynak, kısmi çapraz kontrol"
        - "70–84% — one source, consistent, no counter-example found · tek kaynak, tutarlı, aykırı örnek yok"
        - "50–69% — structure verified, details not · yapı doğrulandı, ayrıntılar değil"
        - "Below 50% — a claim without a measurement yet · henüz ölçümü olmayan iddia"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: "Which file should it go in? (optional) · Hangi dosyaya girmeli? (isteğe bağlı)"
      placeholder: "skills/fivem-assets/trunk/flags.md"
  - type: input
    id: build
    attributes:
      label: "Game build and tool versions · Oyun ve araç sürümleri"
      placeholder: "Legacy b3258, Sollumz 2.9, Blender 4.2"
